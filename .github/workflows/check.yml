name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          package_json_file: app/package.json
      - name: Install the repository Rust toolchain
        working-directory: engine
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: engine
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "$(node -p 'require("./engine/qualified-engine.json").wasmPackVersion')" --locked
      - name: Build the engine package
        working-directory: engine
        run: |
          wasm-pack build --target web --release -- --locked
          sha256sum pkg/dinodreamer_engine_bg.wasm | tee pkg/runtime.sha256
          cat pkg/runtime.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Save the engine for GPU qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-package
          path: engine/pkg/
          retention-days: 14
      - name: Install dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir gallery install --frozen-lockfile
      - name: Check the app
        working-directory: app
        run: |
          pnpm check
          pnpm test --maxWorkers=2
          pnpm build
      - name: Check the gallery
        working-directory: gallery
        run: |
          pnpm check
          pnpm test --maxWorkers=2
      - name: Check the engine
        working-directory: engine
        run: |
          cargo test --locked --no-default-features --features cpu
      - name: Scan added commit lines for credentials
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$BASE..$HEAD"
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then range="$HEAD"; fi
          node gallery/scan-commits-for-credentials.ts . "$range"
      - name: Enforce the tracked file size limit
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { statSync } from 'node:fs';
          const files = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const large = files.filter(file => statSync(file).size >= 1_000_000);
          if (large.length) throw new Error(`Tracked files must be below 1,000,000 bytes: ${large.join(', ')}`);
          JS

  preview:
    name: Preview (optional)
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-package
          path: engine/pkg/
      - name: Install dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir gallery install --frozen-lockfile
      - name: Upload a pull request preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::notice::Preview skipped: CLOUDFLARE_API_TOKEN is not configured.'
            echo 'message=Preview skipped: CLOUDFLARE_API_TOKEN is not configured.' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --dir gallery run deploy "$GITHUB_SHA" --ci --preview-alias="$PREVIEW_ALIAS"
      - name: Report the preview result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_MESSAGE: ${{ steps.preview.outputs.message }}
        run: |
          printf '%s\n\nCommit: `%s`\n' "$PREVIEW_MESSAGE" "$GITHUB_SHA" > "$RUNNER_TEMP/preview-comment.md"
          cat "$RUNNER_TEMP/preview-comment.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file "$RUNNER_TEMP/preview-comment.md"
